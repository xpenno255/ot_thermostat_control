usage:
  occupied_pattern: null
  typical_activity: seated
  typical_clothing_clo: 1.0
  internal_gains_w: null
  draught_sources: []
  notes: EP Pro temperature reads ~35 C (self-heated), do not use. binary_sensor.living_room_occupancy is the aggregate
    used by OT v1. Owner reports this room has always struggled to feel comfortable even when the air temperature
    is met, attributed to the glazed bay and three external walls. The K3 radiators were fitted to keep output up
    at a reduced flow temperature. This is the canonical radiant-deficit room and the first calibration target.
