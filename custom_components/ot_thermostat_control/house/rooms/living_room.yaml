    device_id: 22:066067
    entity: sensor.thm_22_066067_temperature
    height_m: 0.9
    notes: Good height for seated comfort. Not on an external wall. Zone temperature comes from this unit, not the
      HR92s.
    position: DTS92 free-standing on a shelf at about sitting height (~0.9 m), W side of the room roughly 1.2 m
